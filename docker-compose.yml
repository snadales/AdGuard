# ==============================================================================
# PROYECTO: Infraestructura de Red Doméstica
# SERVICIO: AdGuard Home (DNS & AdBlocker)
# ==============================================================================
# DETALLES TÉCNICOS:
#   - Autor: Sebastian Nadales
#   - Versión del Stack: 1.2.0
#   - Fecha Actualización: 2026-05-15
#   - Host: Intel NUC (Ubuntu 26.04 LTS)
#   - IP Local: 192.168.10.22
#
# DESCRIPCIÓN:
#   Implementación de AdGuard Home mediante Docker. Proporciona resolución 
#   DNS de baja latencia y filtrado de contenido a nivel de red.
#
# PERSISTENCIA (Mapeo de volúmenes):
#   - ./work -> /opt/adguardhome/work (Datos, filtros y estadísticas)
#   - ./conf -> /opt/adguardhome/conf (Configuración AdGuardHome.yaml)
#
# NOTAS DE RENDIMIENTO:
#   - Network Mode: Host (Elimina el overhead del bridge de Docker).
#   - Goroutines: Ilimitadas (Configuradas en AdGuardHome.yaml interno).
#   - Rate Limit: Desactivado para permitir benchmarks y alta concurrencia.
# ==============================================================================

version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    # 1. Prioridad del proceso (Nice)
    # Evita que otros contenedores pesados (ej. Plex) le quiten CPU al DNS
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    
    volumes:
      - /home/snadales/docker/adguard/work:/opt/adguardhome/work
      - /home/snadales/docker/adguard/conf:/opt/adguardhome/conf
    
    environment:
      - TZ=America/Santiago
    
    deploy:
      resources:
        limits:
          # 2. El DNS es ligero, 256M es suficiente incluso con caché grande. 
          # Pero reservamos 128M para que siempre los tenga disponibles (Reservations).
          memory: 512M
        reservations:
          memory: 128M
          
    # 3. Optimización de Logs (JSON es pesado para escribir a cada rato)
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true" # Comprime los logs viejos para ahorrar SSD
