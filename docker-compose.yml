# ==============================================================================
# PROYECTO: Infraestructura de Red Doméstica
# SERVICIO: AdGuard Home (DNS & AdBlocker)
# ==============================================================================
# DETALLES TÉCNICOS:
#   - Autor: Sebastian Nadales
#   - Versión del Stack: 1.2.0
#   - Fecha Actualización: 2026-05-15
#   - Host: Intel NUC (Ubuntu 26.04 LTS)
#   - IP Local: 192.168.10.22
#
# DESCRIPCIÓN:
#   Implementación de AdGuard Home mediante Docker. Proporciona resolución 
#   DNS de baja latencia y filtrado de contenido a nivel de red para todo el hogar.
#
# ESTRATEGIA DE RED:
#   - Network Mode: Host. No se conecta a redes virtuales de Docker (bridge).
#     Se amarra directamente a la IP de la NUC para eliminar el overhead de red,
#     garantizando respuestas DNS instantáneas y facilitando la detección de las
#     IPs reales de los clientes en los logs de AdGuard.
#
# PERSISTENCIA (Mapeo de volúmenes):
#   - /home/snadales/docker/adguard/work -> Datos, filtros y estadísticas
#   - /home/snadales/docker/adguard/conf -> Archivo de configuración AdGuardHome.yaml
# ==============================================================================

version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    
    # Enlace directo a la red física de la NUC
    network_mode: host
    
    # Prioridades de ejecución y capacidades del Kernel (Evita degradación por procesos pesados)
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    
    volumes:
      - /home/snadales/docker/adguard/work:/opt/adguardhome/work
      - /home/snadales/docker/adguard/conf:/opt/adguardhome/conf
    
    environment:
      - TZ=America/Santiago
    
    # Gestión estricta de recursos para asegurar estabilidad en la NUC
    deploy:
      resources:
        limits:
          cpus: '0.50'        # Un DNS no necesita más de medio núcleo para procesar miles de consultas
          memory: 512M        # Límite amplio por si cargas listas de bloqueo gigantescas
        reservations:
          memory: 128M        # Garantiza que el sistema siempre le asigne RAM mínima dedicada
          
    # Optimización de logs locales (Previene escrituras masivas innecesarias en el SSD)
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"      # Compresión activa para ahorrar espacio en disco
