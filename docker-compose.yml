# ==============================================================================
# STACK: AdGuard Home - Red Local snadales
# DISPOSITIVO: Intel NUC (Ubuntu 26.04 LTS)
# 
# DESCRIPCIÓN:
#   Servidor DNS principal con bloqueo de publicidad y rastreadores.
#   Configurado en 'network_mode: host' para baja latencia y visibilidad de IPs.
#
# ESTRUCTURA DE CARPETAS (Persistencia):
#   - /opt/adguardhome/work: Almacena datos de filtros, estadísticas y base de datos.
#   - /opt/adguardhome/conf: Contiene AdGuardHome.yaml (configuración central).
#
# OPTIMIZACIONES APLICADAS:
#   - SYS_NICE: Prioridad de proceso alta en el Kernel para evitar lag en DNS.
#   - GitOps: Sincronizado vía Webhook con Portainer para despliegue continuo.
#   - Resources: Reserva de 128MB RAM para garantizar estabilidad bajo carga.
#
# NOTA: Cambios internos (Caché, Goroutines) deben editarse directamente en 
# /home/snadales/docker/adguard/conf/AdGuardHome.yaml con privilegios de sudo.
# ==============================================================================

version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    # 1. Prioridad del proceso (Nice)
    # Evita que otros contenedores pesados (ej. Plex) le quiten CPU al DNS
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    
    volumes:
      - /home/snadales/docker/adguard/work:/opt/adguardhome/work
      - /home/snadales/docker/adguard/conf:/opt/adguardhome/conf
    
    environment:
      - TZ=America/Santiago
    
    deploy:
      resources:
        limits:
          # 2. El DNS es ligero, 256M es suficiente incluso con caché grande. 
          # Pero reservamos 128M para que siempre los tenga disponibles (Reservations).
          memory: 512M
        reservations:
          memory: 128M
          
    # 3. Optimización de Logs (JSON es pesado para escribir a cada rato)
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true" # Comprime los logs viejos para ahorrar SSD
