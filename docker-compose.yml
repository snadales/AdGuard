version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/snadales/docker/adguard/work:/opt/adguardhome/work
      - /home/snadales/docker/adguard/conf:/opt/adguardhome/conf
    environment:
      - TZ=America/Santiago
    # Añadimos límites para asegurar que Docker le asigne prioridad
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"